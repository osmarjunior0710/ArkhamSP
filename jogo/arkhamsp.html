<title>ArkhamSP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Karla:wght@400;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: uma coluna central estreita, como um dossiê aberto sobre a mesa à noite. Visual escuro único, de propósito (mesmo mundo dos dados 3D). */
:root {
  --bg: #0e1110;
  --surface: #161b19;
  --surface-2: #1d2421;
  --line: #2b3431;
  --fg: #e6e1d3;
  --muted: #9a9a8c;
  --accent: #b8a06a;        /* latão gasto */
  --accent-ink: #14120c;
  --esperanca: #ece6d6;
  --mythos: #151515;
  --ok: #8fbf7a;
  --warn: #d3b35a;
  --bad: #c9705e;
  --s-lucido: #8fbf7a;
  --s-abalado: #d3b35a;
  --s-perturbado: #d8894f;
  --s-fraturado: #c9705e;
  --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-story: "Literata", Georgia, serif;
  --font-ui: "Karla", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
[hidden] { display: none !important; }
body {
  font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: .06em; margin: 0; }
.who { font-size: .85rem; color: var(--muted); }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; letter-spacing: .03em; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 1rem; letter-spacing: .06em; margin: 0; color: var(--accent); }
p { margin: 0; }
.lead { font-family: var(--font-story); font-size: 1.05rem; line-height: 1.65; color: var(--fg); max-width: 62ch; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.label { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

section.screen { display: grid; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: grid; gap: 14px; }

button { font: inherit; cursor: pointer; }
.btn {
  font-family: var(--font-display); font-weight: 700; letter-spacing: .08em;
  color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 4px;
  padding: 12px 22px; min-height: 46px;
}
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.btn.link { background: none; border: 0; color: var(--muted); padding: 8px 0; min-height: 40px; font-family: var(--font-ui); font-weight: 600; letter-spacing: 0; text-decoration: underline; text-underline-offset: 3px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.actions.split { justify-content: space-between; }
:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }

input[type="text"], textarea {
  font: inherit; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px;
  padding: 10px 12px; width: 100%; box-sizing: border-box;
}
textarea { min-height: 84px; resize: vertical; font-family: var(--font-story); }
.field { display: grid; gap: 6px; }
.field .hint { font-size: .82rem; color: var(--muted); }
.error { color: var(--bad); font-size: .88rem; }

/* Lista de personagens */
.char-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.char-item { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
.char-item .name { font-family: var(--font-display); font-weight: 700; }
.char-item .concept { font-size: .88rem; color: var(--muted); }

/* Passos da criação (ui-assistente-passos) */
.steps { display: flex; gap: 6px; flex-wrap: wrap; list-style: none; margin: 0; padding: 0; }
.steps li { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; }
.steps li.done { color: var(--fg); border-color: var(--line); }
.steps li.current { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 700; }

/* Contador de pontos */
.budget { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.budget .num { font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.budget.ok .num { color: var(--ok); }
.budget.over .num { color: var(--bad); }

/* Pips (ui-pips) */
.rows { display: grid; gap: 4px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row .nm { font-weight: 700; }
.row .ds { font-size: .82rem; color: var(--muted); }
.pips { display: flex; align-items: center; gap: 6px; }
.pips .pm { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-weight: 700; display: grid; place-items: center; }
.pips .pm:disabled { opacity: .35; cursor: not-allowed; }
.pips .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; padding: 0; }
.pips .dot.on { background: var(--accent); }
.pips .val { font-variant-numeric: tabular-nums; min-width: 1.5ch; text-align: right; font-weight: 700; }

/* Vida / Lucidez */
.split-bars { display: grid; gap: 10px; }
.meter { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) 2ch; gap: 10px; align-items: center; }
.cells { display: grid; grid-template-columns: repeat(9, 1fr); gap: 3px; }
.cells i { height: 14px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); }
.cells.vida i.on { background: #b5523f; border-color: #b5523f; }
.cells.luc i.on { background: #6f9bb0; border-color: #6f9bb0; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

/* Barra de Sanidade (ui-barra-sanidade) */
.sanity { display: grid; gap: 6px; }
.sanity .head { display: flex; justify-content: space-between; gap: 10px; }
.sanity .state { font-family: var(--font-display); font-weight: 700; }
.sanity .blocks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.sanity .block { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.sanity .block i { height: 12px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); }
.sanity .block i.on { background: var(--s-color, var(--s-lucido)); border-color: var(--s-color, var(--s-lucido)); }

/* Cartões de escolha (ui-cartao-escolha) */
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.choice { text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 14px; color: var(--fg); display: grid; gap: 6px; min-width: 0; }
.choice .t { font-family: var(--font-display); font-weight: 700; }
.choice .d { font-size: .88rem; color: var(--muted); }
.choice[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choice[aria-checked="true"] .t::after { content: " ✓"; color: var(--accent); }

/* Régua segmentada (limites) */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { background: transparent; color: var(--muted); border: 0; padding: 8px 14px; min-height: 40px; font-weight: 600; }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }

/* Resumo */
.sum-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; font-size: .95rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.story { font-family: var(--font-story); white-space: pre-wrap; }
.notice { border-left: 3px solid var(--warn); padding: 8px 12px; background: var(--surface); color: var(--fg); font-size: .9rem; }
</style>

<div class="wrap">
  <header class="top">
    <p class="brand">ArkhamSP</p>
    <span class="who" id="who">Conectando…</span>
  </header>

  <!-- Carregando / erro -->
  <section class="screen" id="sLoading">
    <p class="lead">Abrindo o arquivo de investigadores…</p>
  </section>

  <!-- Primeira tela -->
  <section class="screen" id="sHome" hidden>
    <div id="homeBody"></div>
  </section>

  <!-- Escolher personagem -->
  <section class="screen" id="sChoose" hidden>
    <h2>Escolher personagem</h2>
    <ul class="char-list" id="chooseList"></ul>
    <div class="actions"><button class="btn ghost" type="button" data-go="home">Voltar</button></div>
  </section>

  <!-- Criação -->
  <section class="screen" id="sCreate" hidden>
    <ol class="steps" id="steps" aria-label="Passos da criação"></ol>
    <div id="stepBody"></div>
    <p class="error" id="stepError" role="alert" hidden></p>
    <div class="actions split">
      <button class="btn ghost" type="button" id="btnBack">Voltar</button>
      <button class="btn" type="button" id="btnNext">Continuar</button>
    </div>
  </section>

  <!-- Personagem (resumo provisório) -->
  <section class="screen" id="sChar" hidden>
    <div id="charBody"></div>
    <div class="actions"><button class="btn ghost" type="button" data-go="home">Voltar ao início</button></div>
  </section>
</div>

<script>
(function () {
  "use strict";

  // ---------- Regras da ficha (docs/regras/ficha.md) ----------
  const ATRIBUTOS = [
    ["forca", "Força", "Capacidade física, potência muscular e resistência física."],
    ["agilidade", "Agilidade", "Coordenação, velocidade, equilíbrio e reflexos."],
    ["intelecto", "Intelecto", "Raciocínio, análise, memória e compreensão."],
    ["percepcao", "Percepção", "Atenção, sentidos, intuição e leitura do ambiente."],
    ["presenca", "Presença", "Interação, influência e comunicação."],
    ["vontade", "Vontade", "Determinação, disciplina, autocontrole e resistência psicológica."]
  ];
  const ESPECIALIZACOES = [
    ["atletismo", "Atletismo", "Corrida, escalada, natação, saltos e esforço físico."],
    ["combate", "Combate", "Luta corporal, armas brancas e armas de fogo."],
    ["furtividade", "Furtividade", "Esconder-se, infiltrar-se, escapar sem ser percebido."],
    ["sobrevivencia", "Sobrevivência", "Orientação, rastreamento e ambientes hostis."],
    ["conducao", "Condução", "Dirigir carros, motos e outros veículos."],
    ["investigacao", "Investigação", "Procurar pistas, analisar cenas, reconstruir fatos."],
    ["medicina", "Medicina", "Diagnóstico, anatomia, cirurgia e primeiros socorros."],
    ["ciencias", "Ciências", "Biologia, química, física e conhecimento científico."],
    ["humanidades", "Humanidades", "História, religião, cultura e filosofia."],
    ["tecnologia", "Tecnologia", "Computadores, programação, redes e eletrônica."],
    ["persuasao", "Persuasão", "Convencer, negociar, argumentar, ganhar confiança."],
    ["manipulacao", "Manipulação", "Mentir, enganar, intimidar, explorar fraquezas."],
    ["empatia", "Empatia", "Compreender emoções, intenções e comportamentos."],
    ["oficios", "Ofícios", "Mecânica, reparos, arrombamento e trabalhos manuais."]
    // Ocultismo: escondido até o personagem ter experiência sobrenatural.
  ];
  const PONTOS_ATRIBUTO = 8, MAX_ATRIBUTO_CRIACAO = 3;
  const PONTOS_ESPEC = 5, MAX_ESPEC_CRIACAO = 2;
  const VIDA_LUCIDEZ = 14, MIN_VL = 5, MAX_VL = 9;
  const SANIDADE_MAX = 12;
  const MORTALIDADE = [
    ["mortal", "Mortal", "Se cair, morre. O personagem acaba."],
    ["semimortal", "Semimortal", "Se cair, não morre: volta, mas com alguma sequela."],
    ["imortal", "Imortal", "Se cair, desmaia e o universo dá um jeito de salvá-lo, sem sequela."]
  ];
  const LIMITES = [["horror", "Horror"], ["gore", "Gore"], ["violencia", "Violência"]];
  const NIVEIS_LIMITE = [["leve", "Leve"], ["moderado", "Moderado"], ["pesado", "Pesado"]];

  function estadoSanidade(s) {
    if (s <= 0) return { nome: "Insano", cor: "var(--s-fraturado)" };
    if (s <= 3) return { nome: "Fraturado", cor: "var(--s-fraturado)" };
    if (s <= 6) return { nome: "Perturbado", cor: "var(--s-perturbado)" };
    if (s <= 9) return { nome: "Abalado", cor: "var(--s-abalado)" };
    return { nome: "Lúcido", cor: "var(--s-lucido)" };
  }

  // ---------- Utilidades ----------
  const $ = id => document.getElementById(id);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat(Infinity)) if (k !== null && k !== undefined && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
    return el;
  }
  const sum = obj => Object.values(obj).reduce((a, b) => a + b, 0);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Estado ----------
  let db = null, user = null, me = null, myName = "";
  let chars = [];            // [{id, ...dados}]
  let prefs = { ultimoPersonagem: null };
  let charsLoaded = false;
  let draft = null, step = 0, saving = false;

  const SCREENS = ["sLoading", "sHome", "sChoose", "sCreate", "sChar"];
  function show(id) {
    SCREENS.forEach(s => { $(s).hidden = s !== id; });
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }
  document.addEventListener("click", ev => {
    const go = ev.target.closest("[data-go]");
    if (go && go.dataset.go === "home") renderHome();
  });

  function fail(msg) {
    show("sLoading");
    $("sLoading").replaceChildren(h("p", { class: "lead", text: msg }));
  }

  // ---------- Banco ----------
  function charsCol() { return db.collection("personagens/" + me + "/lista"); }
  function prefsDoc() { return db.doc("data/users/" + me + "/prefs"); }

  async function savePrefs(pid) {
    prefs.ultimoPersonagem = pid;
    try { await prefsDoc().set({ ultimoPersonagem: pid, atualizadoEm: Date.now() }); } catch (e) { /* conveniência: se falhar, só não lembra */ }
  }

  // ---------- Primeira tela ----------
  function charLabel(c) { return c.nome || "Sem nome"; }
  function lastUsed() {
    return chars.find(c => c.id === prefs.ultimoPersonagem) || chars[chars.length - 1];
  }

  function renderHome() {
    const body = $("homeBody");
    const n = chars.length;
    const parts = [];
    if (n === 0) {
      parts.push(
        h("div", { class: "card" },
          h("h2", { text: "Nenhum investigador ainda" }),
          h("p", { class: "lead", text: "São Paulo não dorme. Alguém precisa prestar atenção no que acontece entre uma esquina e outra. Crie o seu primeiro personagem para começar." }),
          h("div", { class: "actions" }, h("button", { class: "btn", type: "button", onclick: startCreate, text: "Criar personagem" }))
        )
      );
    } else {
      const last = lastUsed();
      parts.push(
        h("div", { class: "card" },
          h("p", { class: "label", text: n === 1 ? "Seu personagem" : "Último personagem usado" }),
          h("h2", { text: charLabel(last) }),
          last.conceito ? h("p", { class: "muted", text: last.conceito }) : null,
          h("div", { class: "actions" },
            h("button", { class: "btn", type: "button", onclick: () => openChar(last.id), text: "Continuar com " + charLabel(last) }),
            n >= 2 ? h("button", { class: "btn ghost", type: "button", onclick: renderChoose, text: "Escolher personagem" }) : null,
            h("button", { class: "btn ghost", type: "button", onclick: startCreate, text: "Novo personagem" })
          )
        )
      );
    }
    body.replaceChildren(...parts);
    show("sHome");
  }

  function renderChoose() {
    const list = $("chooseList");
    list.replaceChildren(...chars.slice().reverse().map(c =>
      h("li", { class: "char-item" },
        h("div", null, h("div", { class: "name", text: charLabel(c) }), c.conceito ? h("div", { class: "concept", text: c.conceito }) : null),
        h("button", { class: "btn ghost", type: "button", onclick: () => openChar(c.id), text: "Jogar com " + charLabel(c) })
      )
    ));
    show("sChoose");
  }

  function openChar(pid) {
    const c = chars.find(x => x.id === pid);
    if (!c) { renderHome(); return; }
    savePrefs(pid);
    $("charBody").replaceChildren(
      h("h2", { text: charLabel(c) }),
      c.conceito ? h("p", { class: "muted", text: c.conceito }) : null,
      summaryView(c),
      h("p", { class: "notice", text: "Esta é uma prévia. A ficha completa e o começo da história chegam nas próximas etapas." })
    );
    show("sChar");
  }

  // ---------- Componentes ----------
  // ui-pips: valor de 0 a max, com botões − e + e bolinhas clicáveis
  function pipsRow(label, desc, value, max, canAdd, onChange) {
    const dots = [];
    for (let i = 1; i <= max; i++) {
      dots.push(h("button", {
        type: "button", class: "dot" + (i <= value ? " on" : ""),
        "aria-label": label + ": definir " + (value === i ? i - 1 : i),
        disabled: i > value && !canAdd(i - value) ? true : undefined,
        onclick: () => onChange(value === i ? i - 1 : i)
      }));
    }
    return h("div", { class: "row" },
      h("div", null, h("div", { class: "nm", text: label }), h("div", { class: "ds", text: desc })),
      h("div", { class: "pips", role: "group", "aria-label": label },
        h("button", { type: "button", class: "pm", "aria-label": "Diminuir " + label, disabled: value <= 0 ? true : undefined, onclick: () => onChange(value - 1), text: "−" }),
        dots,
        h("button", { type: "button", class: "pm", "aria-label": "Aumentar " + label, disabled: value >= max || !canAdd(1) ? true : undefined, onclick: () => onChange(value + 1), text: "+" }),
        h("span", { class: "val", text: String(value) })
      )
    );
  }

  function budgetView(used, total) {
    const left = total - used;
    return h("div", { class: "budget" + (left === 0 ? " ok" : left < 0 ? " over" : ""), "aria-live": "polite" },
      h("span", { class: "num", text: String(left) }),
      h("span", { class: "muted", text: left === 1 ? "ponto para distribuir" : "pontos para distribuir" })
    );
  }

  function cellsView(kind, n) {
    const cells = [];
    for (let i = 1; i <= MAX_VL; i++) cells.push(h("i", { class: i <= n ? "on" : "" }));
    return h("div", { class: "cells " + kind, "aria-hidden": "true" }, cells);
  }

  // ui-barra-sanidade
  function sanityView(s) {
    const st = estadoSanidade(s);
    const blocks = [];
    for (let b = 0; b < 4; b++) {
      const cells = [];
      for (let k = 1; k <= 3; k++) cells.push(h("i", { class: b * 3 + k <= s ? "on" : "" }));
      blocks.push(h("div", { class: "block" }, cells));
    }
    const wrap = h("div", { class: "sanity", role: "img", "aria-label": "Sanidade " + s + " de 12: " + st.nome },
      h("div", { class: "head" }, h("span", { class: "label", text: "Sanidade" }), h("span", null, h("span", { class: "state", text: st.nome }), " · " + s)),
      h("div", { class: "blocks" }, blocks)
    );
    wrap.style.setProperty("--s-color", st.cor);
    return wrap;
  }

  // ui-cartao-escolha
  function choiceCards(options, value, onPick, groupLabel) {
    return h("div", { class: "choices", role: "radiogroup", "aria-label": groupLabel },
      options.map(([key, title, desc]) => h("button", {
        type: "button", class: "choice", role: "radio", "aria-checked": String(value === key),
        onclick: () => onPick(key)
      }, h("span", { class: "t", text: title }), h("span", { class: "d", text: desc })))
    );
  }

  function segmented(label, value, onPick) {
    return h("div", { class: "row" },
      h("div", { class: "nm", text: label }),
      h("div", { class: "seg", role: "radiogroup", "aria-label": label },
        NIVEIS_LIMITE.map(([k, t]) => h("button", { type: "button", role: "radio", "aria-checked": String(value === k), onclick: () => onPick(k), text: t }))
      )
    );
  }

  function summaryView(c) {
    const at = ATRIBUTOS.map(([k, n]) => [n, c.atributos[k]]);
    const es = ESPECIALIZACOES.filter(([k]) => (c.especializacoes[k] || 0) > 0).map(([k, n]) => [n, c.especializacoes[k]]);
    const mort = MORTALIDADE.find(m => m[0] === c.mortalidade);
    const kv = rows => h("dl", { class: "kv" }, rows.map(([a, b]) => [h("dt", { text: a }), h("dd", { text: String(b) })]));
    return h("div", { class: "card" },
      h("div", { class: "sum-grid" },
        h("div", null, h("h3", { text: "Atributos" }), kv(at)),
        h("div", null, h("h3", { text: "Especializações" }), es.length ? kv(es) : h("p", { class: "muted small", text: "Nenhuma." }))
      ),
      h("div", { class: "split-bars" },
        h("div", { class: "meter" }, h("span", { text: "Vida" }), cellsView("vida", c.vida), h("strong", { text: String(c.vida) })),
        h("div", { class: "meter" }, h("span", { text: "Lucidez" }), cellsView("luc", c.lucidez), h("strong", { text: String(c.lucidez) }))
      ),
      sanityView(c.sanidade),
      h("div", { class: "sum-grid" },
        h("div", null, h("h3", { text: "Crença" }), h("p", { class: "story", text: c.crenca || "Não informada." })),
        h("div", null, h("h3", { text: "Tipo de história" }), h("p", { text: mort ? mort[1] : "—" }),
          h("p", { class: "muted small", text: "Limites: " + LIMITES.map(([k, n]) => n + " " + (NIVEIS_LIMITE.find(x => x[0] === c.limites[k]) || ["", "?"])[1].toLowerCase()).join(", ") }))
      ),
      c.historia ? h("div", null, h("h3", { text: "História" }), h("p", { class: "story", text: c.historia })) : null
    );
  }

  // ---------- Criação ----------
  const STEPS = ["Quem é", "Atributos", "Especializações", "Corpo e mente", "Tipo de história", "Revisar"];

  function newDraft() {
    const atributos = {}, especializacoes = {};
    ATRIBUTOS.forEach(([k]) => { atributos[k] = 0; });
    ESPECIALIZACOES.forEach(([k]) => { especializacoes[k] = 0; });
    return {
      nome: "", conceito: "", historia: "", crenca: "",
      atributos, especializacoes, vida: 7, lucidez: 7, vidaAjustada: false,
      mortalidade: null, limites: { horror: "moderado", gore: "moderado", violencia: "moderado" }
    };
  }
  function sugestaoVida(d) { return clamp(7 + d.atributos.forca - d.atributos.vontade, MIN_VL, MAX_VL); }

  function startCreate() { draft = newDraft(); step = 0; renderStep(); show("sCreate"); }

  function stepError() {
    const d = draft;
    if (step === 0 && !d.nome.trim()) return "Dê um nome ao personagem para continuar.";
    if (step === 1) {
      const left = PONTOS_ATRIBUTO - sum(d.atributos);
      if (left > 0) return "Ainda falta distribuir " + left + (left === 1 ? " ponto" : " pontos") + " de atributo.";
    }
    if (step === 2) {
      const left = PONTOS_ESPEC - sum(d.especializacoes);
      if (left > 0) return "Ainda falta distribuir " + left + (left === 1 ? " ponto" : " pontos") + " de especialização.";
    }
    if (step === 4 && !d.mortalidade) return "Escolha que tipo de história você quer viver.";
    return "";
  }

  function renderStep() {
    $("steps").replaceChildren(...STEPS.map((s, i) => h("li", { class: i === step ? "current" : i < step ? "done" : "", "aria-current": i === step ? "step" : undefined, text: (i + 1) + ". " + s })));
    $("stepError").hidden = true;
    $("btnBack").textContent = step === 0 ? "Cancelar" : "Voltar";
    $("btnNext").textContent = step === STEPS.length - 1 ? "Criar personagem" : "Continuar";
    $("btnNext").disabled = saving;
    const d = draft;
    let body;

    if (step === 0) {
      const field = (id, label, hint, el) => h("div", { class: "field" }, h("label", { for: id, class: "label", text: label }), el, hint ? h("span", { class: "hint", text: hint }) : null);
      const inp = (id, key, max, ph) => { const el = h("input", { id, type: "text", maxlength: String(max), placeholder: ph, value: d[key] }); el.addEventListener("input", () => { d[key] = el.value; }); return el; };
      const ta = (id, key, max, ph) => { const el = h("textarea", { id, maxlength: String(max), placeholder: ph }); el.value = d[key]; el.addEventListener("input", () => { d[key] = el.value; }); return el; };
      body = h("div", { class: "card" },
        h("h2", { text: "Quem é o seu personagem?" }),
        field("fNome", "Nome", null, inp("fNome", "nome", 60, "Ex.: Cida Albuquerque")),
        field("fConceito", "Quem é, em poucas palavras", "Ocupação, idade, o que faz da vida.", inp("fConceito", "conceito", 120, "Ex.: enfermeira aposentada que mora no Bixiga")),
        field("fHistoria", "História curta", "Opcional. De onde vem, o que carrega.", ta("fHistoria", "historia", 1200, "Ex.: trabalhou trinta anos no plantão noturno do Hospital das Clínicas…")),
        field("fCrenca", "Crença", "Religião, fé, ateísmo, superstição… muda como o personagem interpreta o que vê.", ta("fCrenca", "crenca", 400, "Ex.: católica de missa no domingo, mas não passa embaixo de escada"))
      );
    }

    if (step === 1) {
      const used = sum(d.atributos);
      body = h("div", { class: "card" },
        h("h2", { text: "Atributos" }),
        h("p", { class: "muted", text: "Capacidades naturais, independentes da profissão. Cada um vai de 0 a 3 na criação." }),
        budgetView(used, PONTOS_ATRIBUTO),
        h("div", { class: "rows" }, ATRIBUTOS.map(([k, n, ds]) => pipsRow(n, ds, d.atributos[k], MAX_ATRIBUTO_CRIACAO,
          extra => sum(d.atributos) + extra <= PONTOS_ATRIBUTO,
          v => { d.atributos[k] = clamp(v, 0, MAX_ATRIBUTO_CRIACAO); if (!d.vidaAjustada) { d.vida = sugestaoVida(d); d.lucidez = VIDA_LUCIDEZ - d.vida; } renderStep(); })))
      );
    }

    if (step === 2) {
      const used = sum(d.especializacoes);
      body = h("div", { class: "card" },
        h("h2", { text: "Especializações" }),
        h("p", { class: "muted", text: "O que o personagem aprendeu: profissão, estudo, experiência. Cada uma vai de 0 a 2 na criação." }),
        budgetView(used, PONTOS_ESPEC),
        h("div", { class: "rows" }, ESPECIALIZACOES.map(([k, n, ds]) => pipsRow(n, ds, d.especializacoes[k], MAX_ESPEC_CRIACAO,
          extra => sum(d.especializacoes) + extra <= PONTOS_ESPEC,
          v => { d.especializacoes[k] = clamp(v, 0, MAX_ESPEC_CRIACAO); renderStep(); }))),
        h("p", { class: "muted small", text: "Existe mais uma especialização que ninguém escolhe na criação. Ela aparece quando o personagem viver algo que não devia." })
      );
    }

    if (step === 3) {
      // Controle: valor = Lucidez (arrastar para a direita = mais mente). Atualiza as barras no lugar, sem recriar o controle.
      const range = h("input", { id: "fVida", type: "range", min: String(MIN_VL), max: String(MAX_VL), step: "1", value: String(d.lucidez), "aria-label": "Lucidez (a Vida é o restante de 14)" });
      const bars = h("div", { class: "split-bars" });
      const sug = sugestaoVida(d);
      const sugBtn = h("button", { class: "btn ghost", type: "button", text: "Usar sugestão da ficha (Vida " + sug + " / Lucidez " + (VIDA_LUCIDEZ - sug) + ")" });
      const paint = () => {
        bars.replaceChildren(
          h("div", { class: "meter" }, h("span", { text: "Vida" }), cellsView("vida", d.vida), h("strong", { text: String(d.vida) })),
          h("div", { class: "meter" }, h("span", { text: "Lucidez" }), cellsView("luc", d.lucidez), h("strong", { text: String(d.lucidez) }))
        );
        range.value = String(d.lucidez);
        sugBtn.disabled = d.vida === sug;
      };
      range.addEventListener("input", () => { d.lucidez = Number(range.value); d.vida = VIDA_LUCIDEZ - d.lucidez; d.vidaAjustada = true; paint(); });
      sugBtn.addEventListener("click", () => { d.vida = sug; d.lucidez = VIDA_LUCIDEZ - sug; d.vidaAjustada = false; paint(); });
      paint();
      body = h("div", { class: "card" },
        h("h2", { text: "Corpo e mente" }),
        h("p", { class: "muted", text: "Vida e Lucidez somam 14. Quanto mais o corpo aguenta, menos a mente aguenta, e vice-versa. Cada lado fica entre 5 e 9." }),
        bars,
        h("div", { class: "field" }, h("label", { for: "fVida", class: "label", text: "◂ Mais corpo · Mais mente ▸" }), range),
        h("div", { class: "actions" }, sugBtn),
        h("p", { class: "muted small", text: "A sugestão vem da Força e da Vontade. Você pode ajustar como quiser." }),
        sanityView(SANIDADE_MAX),
        h("p", { class: "muted small", text: "Todo personagem começa com Sanidade 12. Ela só cai quando ele vê o que não devia, e não volta." })
      );
    }

    if (step === 4) {
      body = h("div", { class: "card" },
        h("h2", { text: "Que tipo de história você quer viver?" }),
        choiceCards(MORTALIDADE, d.mortalidade, k => { d.mortalidade = k; renderStep(); }, "Modo de mortalidade"),
        h("h3", { text: "Seus limites" }),
        h("p", { class: "muted small", text: "A mestra ajusta as descrições ao que você prefere ler. Você pode mudar depois." }),
        h("div", { class: "rows" }, LIMITES.map(([k, n]) => segmented(n, d.limites[k], v => { d.limites[k] = v; renderStep(); })))
      );
    }

    if (step === 5) {
      const preview = Object.assign({}, d, { sanidade: SANIDADE_MAX });
      body = h("div", { class: "screen" },
        h("div", null, h("p", { class: "label", text: "Revisar" }), h("h2", { text: d.nome.trim() || "Sem nome" }), d.conceito ? h("p", { class: "muted", text: d.conceito }) : null),
        summaryView(preview),
        h("p", { class: "muted small", text: "Confira tudo. Depois de criado, o personagem entra no seu arquivo e já pode ser escolhido na primeira tela." })
      );
    }

    $("stepBody").replaceChildren(body);
  }

  $("btnBack").addEventListener("click", () => {
    if (saving) return;
    if (step === 0) { draft = null; renderHome(); return; }
    step -= 1; renderStep();
  });

  $("btnNext").addEventListener("click", async () => {
    if (saving) return;
    const err = stepError();
    if (err) { $("stepError").textContent = err; $("stepError").hidden = false; return; }
    if (step < STEPS.length - 1) { step += 1; renderStep(); return; }
    await createCharacter();
  });

  async function createCharacter() {
    const d = draft;
    if (sum(d.atributos) !== PONTOS_ATRIBUTO || sum(d.especializacoes) !== PONTOS_ESPEC || !d.nome.trim() || !d.mortalidade) {
      $("stepError").textContent = "Algo ficou incompleto. Volte e confira os passos.";
      $("stepError").hidden = false; return;
    }
    saving = true; $("btnNext").disabled = true; $("btnNext").textContent = "Criando…";
    const now = Date.now();
    const doc = {
      versaoFicha: 1,
      nome: d.nome.trim().slice(0, 60),
      conceito: d.conceito.trim().slice(0, 120),
      historia: d.historia.trim().slice(0, 1200),
      crenca: d.crenca.trim().slice(0, 400),
      atributos: Object.assign({}, d.atributos),
      especializacoes: Object.assign({ ocultismo: 0 }, d.especializacoes),
      ocultismoRevelado: false,
      vida: d.vida, vidaMax: d.vida,
      lucidez: d.lucidez, lucidezMax: d.lucidez,
      sanidade: SANIDADE_MAX,
      mortalidade: d.mortalidade,
      limites: Object.assign({}, d.limites),
      nivel: 1,
      donoId: me,
      criadoEm: now, atualizadoEm: now
    };
    try {
      const ref = await charsCol().add(doc);
      await savePrefs(ref.id);
      if (!chars.find(c => c.id === ref.id)) chars.push(Object.assign({ id: ref.id }, doc));
      draft = null; saving = false;
      openChar(ref.id);
    } catch (e) {
      saving = false;
      $("btnNext").disabled = false; $("btnNext").textContent = "Criar personagem";
      const code = e && e.code;
      $("stepError").textContent = code === "invalid_argument"
        ? "Sua conta não tem permissão para criar personagens neste jogo. Peça ao Osmar para compartilhar com você como Editor."
        : code === "quota_exceeded" ? "O arquivo do jogo está cheio. Avise o Osmar."
        : "Não foi possível salvar agora (" + (code || "erro") + "). Tente de novo em alguns segundos.";
      $("stepError").hidden = false;
    }
  }

  // ---------- Início ----------
  (async () => {
    const c = window.claude;
    if (!c || typeof c.use !== "function") { fail("Abra este jogo pelo Claude, logado na sua conta."); $("who").textContent = ""; return; }
    [user, db] = await Promise.all([c.use("user"), c.use("db")]);
    if (!user || !db) { fail("Não foi possível abrir o arquivo do jogo nesta visualização. Abra pelo Claude, logado na sua conta."); $("who").textContent = ""; return; }
    try { me = await user.id(); myName = await user.name(); } catch (e) { me = null; }
    if (!me) { fail("Não foi possível identificar sua conta. Entre no Claude e abra o jogo de novo."); $("who").textContent = ""; return; }
    $("who").textContent = myName ? "Jogando como " + myName : "Conectado";

    try { const p = await prefsDoc().get(); if (p.exists) prefs = Object.assign(prefs, p.data()); } catch (e) { /* sem preferência salva */ }

    const timer = setTimeout(() => { if (!charsLoaded) fail("O arquivo do jogo está demorando para responder. Verifique a conexão e recarregue a página."); }, 10000);
    charsCol().orderBy("criadoEm", "asc").onSnapshot(snap => {
      chars = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      const first = !charsLoaded;
      if (!snap.metadata.fromCache || snap.size) { charsLoaded = true; clearTimeout(timer); }
      if (first && charsLoaded && $("sCreate").hidden && $("sChar").hidden) renderHome();
      else if (!$("sHome").hidden) renderHome();
    }, err => {
      clearTimeout(timer);
      fail("Não foi possível ler seus personagens (" + (err && err.code) + "). Recarregue a página.");
    });
  })();
})();
</script>

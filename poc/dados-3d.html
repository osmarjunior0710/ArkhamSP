<title>Mesa de Dados ArkhamSP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Karla:wght@400;600&display=swap">
<style>
/* Layout: one dark "investigation table" scene on top, a compact control strip and result card below. Single dark look on purpose. */
:root {
  --bg: #0e1110;          /* tinta de mesa, quase preto esverdeado */
  --surface: #171c1a;
  --line: #2b3431;
  --fg: #e6e1d3;          /* papel envelhecido */
  --muted: #9a9a8c;
  --accent: #b8a06a;      /* latão gasto */
  --good: #8fbf7a;
  --mid: #d3b35a;
  --bad: #c9705e;
  --crit: #e8d79a;
  --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-body: "Karla", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: .04em; margin: 0; text-wrap: balance; }
.tag { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.scene {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  max-width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, #1d2522 0%, var(--bg) 75%);
}
@media (max-width: 560px) { .scene { aspect-ratio: 1 / 1; } }
.scene canvas { display: block; width: 100%; height: 100%; }
.legend {
  position: absolute; left: 12px; bottom: 10px;
  display: flex; gap: 14px; font-size: .8rem; color: var(--muted);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chip { width: 12px; height: 12px; border-radius: 2px; border: 1px solid var(--muted); }
.chip.w { background: #ece6d6; }
.chip.b { background: #141414; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--bad); }

.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.field { display: grid; gap: 4px; }
.field label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
select, input[type="number"] {
  font: inherit; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; min-height: 40px;
}
input[type="number"] { width: 6rem; }
button {
  font-family: var(--font-display); font-weight: 700; font-size: 1rem; letter-spacing: .1em;
  color: var(--bg); background: var(--accent); border: 0; border-radius: 4px;
  padding: 10px 28px; min-height: 44px; cursor: pointer;
}
button:hover { filter: brightness(1.08); }
button:disabled { opacity: .55; cursor: progress; }
button.ghost {
  font-family: var(--font-body); font-weight: 600; font-size: .85rem; letter-spacing: .02em;
  color: var(--muted); background: transparent; border: 1px solid var(--line); padding: 8px 14px;
}
:focus-visible { outline: 2px solid var(--crit); outline-offset: 2px; }

.result {
  display: grid; gap: 6px; padding: 16px 18px;
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 4px;
}
.result .kind { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; letter-spacing: .03em; }
.result .math { font-variant-numeric: tabular-nums; color: var(--muted); }
.result[data-tone="crit"] { border-left-color: var(--crit); } .result[data-tone="crit"] .kind { color: var(--crit); }
.result[data-tone="good"] { border-left-color: var(--good); } .result[data-tone="good"] .kind { color: var(--good); }
.result[data-tone="mid"]  { border-left-color: var(--mid); }  .result[data-tone="mid"] .kind  { color: var(--mid); }
.result[data-tone="bad"]  { border-left-color: var(--bad); }  .result[data-tone="bad"] .kind  { color: var(--bad); }

details { border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
.force { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-top: 12px; }
.force .check { display: flex; align-items: center; gap: 8px; min-height: 40px; }

.history h2 { font-family: var(--font-display); font-size: .95rem; letter-spacing: .08em; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
.history ol { margin: 0; padding-left: 1.2rem; display: grid; gap: 2px; font-variant-numeric: tabular-nums; font-size: .9rem; }
.history .empty { color: var(--muted); font-size: .9rem; margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1>Mesa de Dados</h1>
    <span class="tag">Prova de conceito · AHSP-10</span>
  </header>

  <div class="scene" id="scene">
    <div class="legend" aria-hidden="true">
      <span><i class="chip w"></i>Bênção</span>
      <span><i class="chip b"></i>Mythos</span>
    </div>
  </div>

  <div class="controls">
    <div class="field">
      <label for="attr">Atributo</label>
      <input id="attr" type="number" min="-5" max="15" step="1" value="0">
    </div>
    <div class="field">
      <label for="dc">Dificuldade</label>
      <select id="dc">
        <option value="8">8 · Muito fácil</option>
        <option value="11">11 · Fácil</option>
        <option value="14" selected>14 · Médio</option>
        <option value="17">17 · Difícil</option>
        <option value="20">20 · Muito difícil</option>
        <option value="23">23 · Quase impossível</option>
      </select>
    </div>
    <button id="roll" type="button">Rolar</button>
    <button id="mute" class="ghost" type="button" aria-pressed="false">Som: ligado</button>
  </div>

  <div class="result" id="result" data-tone="none" aria-live="polite">
    <div class="kind" id="kind">Pronto para rolar</div>
    <div class="math" id="math">Escolha o atributo e a dificuldade, depois clique em Rolar.</div>
  </div>

  <details>
    <summary>Modo de teste: escolher os valores dos dados</summary>
    <div class="force">
      <label class="check" for="forceOn"><input id="forceOn" type="checkbox"> Usar valores escolhidos</label>
      <div class="field">
        <label for="forceW">Branco (Bênção)</label>
        <select id="forceW"></select>
      </div>
      <div class="field">
        <label for="forceB">Preto (Mythos)</label>
        <select id="forceB"></select>
      </div>
    </div>
  </details>

  <section class="history">
    <h2>Últimas rolagens</h2>
    <p class="empty" id="histEmpty">Nenhuma rolagem ainda.</p>
    <ol id="hist" hidden></ol>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(function () {
  "use strict";
  const sceneEl = document.getElementById("scene");
  const rollBtn = document.getElementById("roll");
  const muteBtn = document.getElementById("mute");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Selects do modo de teste
  for (const id of ["forceW", "forceB"]) {
    const sel = document.getElementById(id);
    for (let v = 1; v <= 12; v++) sel.add(new Option(String(v), String(v)));
    sel.value = "12";
  }

  if (typeof THREE === "undefined" || typeof CANNON === "undefined") {
    sceneEl.insertAdjacentHTML("beforeend", '<div class="fallback">A biblioteca 3D não carregou. Recarregue a página.</div>');
    rollBtn.disabled = true;
    return;
  }

  // ---------- Regra (AHSP-6) ----------
  function resolve(white, black, attr, dc) {
    const total = white + black + attr;
    if (white === black) return { kind: "Crítico", tone: "crit", total };
    const pass = total >= dc;
    if (pass) return white > black
      ? { kind: "Sucesso", tone: "good", total }
      : { kind: "Sucesso com deslize", tone: "mid", total };
    return white > black
      ? { kind: "Falha com progresso", tone: "mid", total }
      : { kind: "Falha", tone: "bad", total };
  }
  function d12() {
    const buf = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / 12) * 12;
    let x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return (x % 12) + 1;
  }
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------- Som (sintetizado, sem arquivos) ----------
  let audio = null;
  let muted = false;
  try { muted = localStorage.getItem("ahsp-dados-mudo") === "1"; } catch (e) { /* sem storage */ }
  function syncMute() {
    muteBtn.textContent = muted ? "Som: desligado" : "Som: ligado";
    muteBtn.setAttribute("aria-pressed", String(muted));
  }
  syncMute();
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    try { localStorage.setItem("ahsp-dados-mudo", muted ? "1" : "0"); } catch (e) { /* ok */ }
    syncMute();
  });
  function ensureAudio() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }
  function clack(strength) {
    if (muted || !audio) return;
    const t = audio.currentTime;
    const len = Math.floor(audio.sampleRate * 0.05);
    const buf = audio.createBuffer(1, len, audio.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = audio.createBufferSource();
    src.buffer = buf;
    const band = audio.createBiquadFilter();
    band.type = "bandpass";
    band.frequency.value = rnd(1800, 3400);
    band.Q.value = 2.5;
    const gain = audio.createGain();
    gain.gain.value = Math.min(1, strength) * 0.7;
    src.connect(band).connect(gain).connect(audio.destination);
    src.start(t);
  }

  // ---------- Cena ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  sceneEl.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, 16 / 9, 0.1, 100);

  scene.add(new THREE.HemisphereLight(0xd8d2c0, 0x0b0f0d, 0.55));
  const key = new THREE.DirectionalLight(0xfff1d6, 1.05);
  key.position.set(-4, 10, 5);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.camera.left = -9; key.shadow.camera.right = 9;
  key.shadow.camera.top = 9; key.shadow.camera.bottom = -9;
  key.shadow.radius = 4;
  scene.add(key);
  const rim = new THREE.PointLight(0x6f8f86, 0.5, 30);
  rim.position.set(5, 4, -5);
  scene.add(rim);

  const table = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.45 }));
  table.rotation.x = -Math.PI / 2;
  table.receiveShadow = true;
  scene.add(table);

  // ---------- Geometria do d12 ----------
  const PHI = (1 + Math.sqrt(5)) / 2;
  const SIZE = 1.0; // raio circunscrito
  const rawVerts = [];
  for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) rawVerts.push([x, y, z]);
  for (const a of [-1, 1]) for (const b of [-1, 1]) {
    rawVerts.push([0, a / PHI, b * PHI]);
    rawVerts.push([a / PHI, b * PHI, 0]);
    rawVerts.push([b * PHI, 0, a / PHI]);
  }
  const verts = rawVerts.map(v => new THREE.Vector3(...v).multiplyScalar(SIZE / Math.sqrt(3)));

  // Faces em pares: índice par = face "positiva" (1..6), ímpar = face oposta (13 - v). Oposta de i = i ^ 1.
  const posNormals = [
    [0, PHI, 1], [0, -PHI, 1], [1, 0, PHI], [-1, 0, PHI], [PHI, 1, 0], [PHI, -1, 0]
  ].map(n => new THREE.Vector3(...n).normalize());
  const faces = [];
  posNormals.forEach((n, i) => {
    faces.push({ normal: n.clone(), base: i + 1 });
    faces.push({ normal: n.clone().negate(), base: 12 - i });
  });

  let inradius = 0;
  faces.forEach(f => {
    const n = f.normal;
    const idx = verts.map((v, i) => ({ i, d: v.dot(n) })).sort((a, b) => b.d - a.d).slice(0, 5).map(o => o.i);
    const center = idx.reduce((acc, i) => acc.add(verts[i]), new THREE.Vector3()).multiplyScalar(1 / 5);
    inradius = center.length();
    const vAxis = verts[idx[0]].clone().sub(center).normalize();     // "topo" do número
    const uAxis = new THREE.Vector3().crossVectors(vAxis, n).normalize(); // direita do número
    idx.sort((a, b) => {
      const pa = verts[a].clone().sub(center), pb = verts[b].clone().sub(center);
      return Math.atan2(pa.dot(vAxis), pa.dot(uAxis)) - Math.atan2(pb.dot(vAxis), pb.dot(uAxis));
    }); // anti-horário visto de fora
    Object.assign(f, { ring: idx, center, uAxis, vAxis, r: verts[idx[0]].distanceTo(center) });
  });

  const geom = new THREE.BufferGeometry();
  (function buildGeometry() {
    const positions = [], uvs = [], normals = [];
    faces.forEach((f, fi) => {
      const uvOf = p => {
        const d = p.clone().sub(f.center);
        return [0.5 + 0.46 * d.dot(f.uAxis) / f.r, 0.5 + 0.46 * d.dot(f.vAxis) / f.r];
      };
      const start = positions.length / 3;
      for (let k = 0; k < 5; k++) {
        const a = verts[f.ring[k]], b = verts[f.ring[(k + 1) % 5]];
        for (const p of [f.center, a, b]) {
          positions.push(p.x, p.y, p.z);
          normals.push(f.normal.x, f.normal.y, f.normal.z);
          uvs.push(...uvOf(p));
        }
      }
      geom.addGroup(start, 15, fi);
    });
    geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
    geom.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
    geom.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  })();
  const edgesGeom = new THREE.EdgesGeometry(geom, 10);

  // Forma física: o mesmo dodecaedro
  const shapeVerts = verts.map(v => new CANNON.Vec3(v.x, v.y, v.z));
  const shapeFaces = faces.map(f => f.ring.slice());
  function newShape() { return new CANNON.ConvexPolyhedron(shapeVerts, shapeFaces); }

  // ---------- Texturas das faces ----------
  function paintFace(slot, value, angle) {
    const g = slot.ctx, s = slot.style;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = s.bg; g.fillRect(0, 0, 256, 256);
    const grad = g.createRadialGradient(128, 128, 30, 128, 128, 150);
    grad.addColorStop(0, "rgba(255,255,255,0.06)");
    grad.addColorStop(1, s.vignette);
    g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
    g.translate(128, 128);
    g.rotate(angle);
    g.fillStyle = s.ink;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.font = '700 ' + (value >= 10 ? 92 : 108) + 'px "Cinzel", Georgia, serif';
    g.fillText(String(value), 0, 8);
    if (value === 6 || value === 9) g.fillRect(-30, 68, 60, 8); // sublinhado: distingue 6 de 9
    slot.tex.needsUpdate = true;
  }

  function makeDie(style) {
    const slots = faces.map(() => {
      const c = document.createElement("canvas");
      c.width = c.height = 256;
      const tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = 4;
      return { ctx: c.getContext("2d"), tex, style };
    });
    const mats = slots.map(s => new THREE.MeshStandardMaterial({ map: s.tex, roughness: style.roughness, metalness: 0 }));
    const mesh = new THREE.Mesh(geom, mats);
    mesh.castShadow = true;
    mesh.add(new THREE.LineSegments(edgesGeom, new THREE.LineBasicMaterial({ color: style.edge, transparent: true, opacity: 0.55 })));
    scene.add(mesh);
    const die = { mesh, slots, labels: faces.map(f => f.base) };
    paintAll(die, -1, 0);
    return die;
  }
  function paintAll(die, upFace, upAngle) {
    die.slots.forEach((s, i) => paintFace(s, die.labels[i], i === upFace ? upAngle : 0));
  }

  // ---------- Física ----------
  const DT = 1 / 60;
  const UP = new THREE.Vector3(0, 1, 0);
  let arena = { xMin: -4, xMax: 4, zMin: -2.5, zMax: 2.5 };

  function upFaceOf(q) {
    let best = -1, bestY = -2;
    faces.forEach((f, i) => {
      const y = f.normal.clone().applyQuaternion(q).y;
      if (y > bestY) { bestY = y; best = i; }
    });
    return { face: best, flat: bestY > 0.97 };
  }

  function simulate() {
    const world = new CANNON.World();
    world.gravity.set(0, -40, 0);
    world.broadphase = new CANNON.NaiveBroadphase();
    world.solver.iterations = 16;
    world.allowSleep = true;

    const floorMat = new CANNON.Material("mesa");
    const wallMat = new CANNON.Material("borda");
    const diceMat = new CANNON.Material("dado");
    world.addContactMaterial(new CANNON.ContactMaterial(floorMat, diceMat, { friction: 0.25, restitution: 0.35 }));
    world.addContactMaterial(new CANNON.ContactMaterial(wallMat, diceMat, { friction: 0.05, restitution: 0.6 }));
    world.addContactMaterial(new CANNON.ContactMaterial(diceMat, diceMat, { friction: 0.1, restitution: 0.5 }));

    const floor = new CANNON.Body({ mass: 0, material: floorMat });
    floor.addShape(new CANNON.Plane());
    floor.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
    world.addBody(floor);

    const { xMin, xMax, zMin, zMax } = arena;
    const T = 1, H = 20;
    const addWall = (x, z, hx, hz) => {
      const w = new CANNON.Body({ mass: 0, material: wallMat });
      w.addShape(new CANNON.Box(new CANNON.Vec3(hx, H, hz)));
      w.position.set(x, H, z);
      world.addBody(w);
    };
    const cx = (xMin + xMax) / 2, cz = (zMin + zMax) / 2;
    const hx = (xMax - xMin) / 2 + T, hz = (zMax - zMin) / 2 + T;
    addWall(xMin - T, cz, T, hz);
    addWall(xMax + T, cz, T, hz);
    addWall(cx, zMin - T, hx, T);
    addWall(cx, zMax + T, hx, T);

    // Lançamento: os dois dados saem juntos de um lado da mesa
    const side = Math.random() < 0.5 ? -1 : 1;
    const startX = side > 0 ? xMax - 1.1 : xMin + 1.1;
    const hits = [];
    const bodies = [-0.8, 0.8].map((offZ, k) => {
      const b = new CANNON.Body({ mass: 1, material: diceMat, shape: newShape() });
      b.position.set(startX + rnd(-0.3, 0.3), rnd(2.5, 3.5), cz + offZ + rnd(-0.3, 0.3));
      b.quaternion.setFromEuler(rnd(0, 6.28), rnd(0, 6.28), rnd(0, 6.28));
      b.velocity.set(-side * rnd(10, 15), rnd(-1, 2), rnd(-3, 3));
      b.angularVelocity.set(rnd(-22, 22), rnd(-22, 22), rnd(-22, 22));
      b.linearDamping = 0.12;
      b.angularDamping = 0.12;
      b.allowSleep = true;
      b.sleepSpeedLimit = 0.25;
      b.sleepTimeLimit = 0.25;
      b._lastHit = -10;
      b.addEventListener("collide", e => {
        const v = Math.abs(e.contact.getImpactVelocityAlongNormal());
        if (v > 1.2 && step - b._lastHit > 3) { hits.push({ step, v }); b._lastHit = step; }
      });
      world.addBody(b);
      return b;
    });

    const frames = [];
    let step = 0;
    const MAX = 60 * 8;
    for (; step < MAX; step++) {
      world.step(DT);
      frames.push(bodies.map(b => [b.position.x, b.position.y, b.position.z, b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w]));
      if (step > 30 && bodies.every(b => b.sleepState === CANNON.Body.SLEEPING)) break;
    }
    return { frames, hits };
  }

  // Troca os números das faces para que a face que caiu para cima mostre o valor sorteado
  function relabel(die, landFace, target) {
    die.labels = faces.map(f => f.base);
    const L = landFace;
    const F = die.labels.indexOf(target);
    if (F === L) return;
    const swap = (a, b) => { const t = die.labels[a]; die.labels[a] = die.labels[b]; die.labels[b] = t; };
    swap(L, F);
    if ((L ^ 1) !== F) swap(L ^ 1, F ^ 1); // mantém faces opostas somando 13
  }
  // Ângulo para o número da face de cima ficar de pé para a câmera
  function uprightAngle(faceIdx, q) {
    const f = faces[faceIdx];
    const want = new THREE.Vector3(0, 0, -1).applyQuaternion(q.clone().invert());
    return Math.atan2(want.dot(f.uAxis), want.dot(f.vAxis));
  }

  // ---------- Dados ----------
  let dice = null;
  function buildDice() {
    dice = [
      makeDie({ bg: "#ece6d6", ink: "#1a1a1a", vignette: "rgba(120,105,80,0.25)", edge: 0x8a8070, roughness: 0.45 }),
      makeDie({ bg: "#151515", ink: "#efe7d2", vignette: "rgba(0,0,0,0.45)", edge: 0x5a5a5a, roughness: 0.35 })
    ];
    restPose(dice[0], 7, -1.4, 0.1);
    restPose(dice[1], 5, 1.4, -0.1);
  }
  function restPose(die, value, x, z) {
    const fi = die.labels.indexOf(value);
    const f = faces[fi];
    const qAlign = new THREE.Quaternion().setFromUnitVectors(f.normal, UP);
    const t = f.vAxis.clone().applyQuaternion(qAlign);
    const qYaw = new THREE.Quaternion().setFromAxisAngle(UP, Math.PI - Math.atan2(t.x, t.z));
    die.mesh.quaternion.copy(qYaw.multiply(qAlign));
    die.mesh.position.set(x, inradius, z);
  }

  // ---------- Reprodução ----------
  let playback = null;
  function applyFrame(fr) {
    dice.forEach((d, k) => {
      const s = fr[k];
      d.mesh.position.set(s[0], s[1], s[2]);
      d.mesh.quaternion.set(s[3], s[4], s[5], s[6]);
    });
  }
  function frame(now) {
    if (playback) {
      const p = playback;
      const idx = Math.max(0, Math.min(p.frames.length - 1, Math.floor((now - p.t0) / (DT * 1000))));
      applyFrame(p.frames[idx]);
      while (p.hitIdx < p.hits.length && p.hits[p.hitIdx].step <= idx) {
        clack(p.hits[p.hitIdx].v / 14);
        p.hitIdx++;
      }
      if (idx >= p.frames.length - 1) { playback = null; p.done(); }
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // Área da mesa = o que a câmera enxerga no chão
  const ray = new THREE.Raycaster();
  const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  function floorPoint(nx, ny) {
    ray.setFromCamera(new THREE.Vector2(nx, ny), camera);
    const p = new THREE.Vector3();
    return ray.ray.intersectPlane(ground, p) ? p : null;
  }
  function resize() {
    const w = sceneEl.clientWidth, h = sceneEl.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const dist = camera.aspect < 1.2 ? 12 : 10.5;
    camera.position.set(0, dist * 0.9, dist * 0.42);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld();
    const tl = floorPoint(-0.9, 0.82), tr = floorPoint(0.9, 0.82), bl = floorPoint(-0.9, -0.82), br = floorPoint(0.9, -0.82);
    if (tl && tr && bl && br) {
      // recuo extra para o dado inteiro (não só o centro) ficar dentro da tela
      arena = {
        xMin: Math.max(tl.x, bl.x) + 0.4, xMax: Math.min(tr.x, br.x) - 0.4,
        zMin: Math.max(tl.z, tr.z) + 0.9, zMax: Math.min(bl.z, br.z) - 0.4
      };
    }
  }
  new ResizeObserver(resize).observe(sceneEl);
  resize();

  // ---------- Interface ----------
  const resultEl = document.getElementById("result");
  const kindEl = document.getElementById("kind");
  const mathEl = document.getElementById("math");
  const histEl = document.getElementById("hist");
  const histEmpty = document.getElementById("histEmpty");
  const history = [];

  function showResult(w, b, attr, dc) {
    const r = resolve(w, b, attr, dc);
    resultEl.dataset.tone = r.tone;
    kindEl.textContent = r.kind;
    const sign = attr >= 0 ? "+ " + attr : "− " + Math.abs(attr);
    mathEl.textContent = "Bênção " + w + " + Mythos " + b + " " + sign + " = " + r.total + " contra " + dc +
      (w === b ? " · dados iguais: sucesso automático" : "");
    history.unshift(r.kind + " · " + w + " e " + b + " · total " + r.total + " / dif. " + dc);
    history.length = Math.min(history.length, 6);
    histEl.replaceChildren(...history.map(t => { const li = document.createElement("li"); li.textContent = t; return li; }));
    histEl.hidden = false; histEmpty.hidden = true;
  }

  rollBtn.addEventListener("click", () => {
    if (!dice || playback) return;
    ensureAudio();
    if (audio && audio.state === "suspended") audio.resume();
    const attr = parseInt(document.getElementById("attr").value, 10) || 0;
    const dc = parseInt(document.getElementById("dc").value, 10);
    const forced = document.getElementById("forceOn").checked;
    const values = forced
      ? [parseInt(document.getElementById("forceW").value, 10), parseInt(document.getElementById("forceB").value, 10)]
      : [d12(), d12()];

    // Simula até os dois dados pararem com uma face reta para cima
    let sim, ups;
    for (let tries = 0; tries < 8; tries++) {
      sim = simulate();
      const last = sim.frames[sim.frames.length - 1];
      ups = last.map(s => upFaceOf(new THREE.Quaternion(s[3], s[4], s[5], s[6])));
      if (ups.every(u => u.flat)) break;
    }
    const last = sim.frames[sim.frames.length - 1];
    dice.forEach((d, k) => {
      relabel(d, ups[k].face, values[k]);
      const q = new THREE.Quaternion(last[k][3], last[k][4], last[k][5], last[k][6]);
      paintAll(d, ups[k].face, uprightAngle(ups[k].face, q));
    });

    rollBtn.disabled = true;
    resultEl.dataset.tone = "none";
    kindEl.textContent = "Rolando…";
    mathEl.textContent = " ";
    const done = () => { showResult(values[0], values[1], attr, dc); rollBtn.disabled = false; };
    if (reduceMotion) { applyFrame(last); done(); return; }
    playback = { frames: sim.frames, hits: sim.hits, hitIdx: 0, t0: performance.now(), done };
  });

  // Espera a fonte dos números antes de desenhar as faces (com limite de tempo)
  const fontReady = document.fonts && document.fonts.load
    ? Promise.race([document.fonts.load('700 100px "Cinzel"'), new Promise(r => setTimeout(r, 2500))])
    : Promise.resolve();
  fontReady.catch(() => {}).then(() => { buildDice(); requestAnimationFrame(frame); });
})();
</script>
